name: Actualizar lista oficial de SAP
# Cada lunes descarga el Cloudification Repository de SAP. Si ha cambiado, lo sube y la web se vuelve a publicar.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run sap
      - name: Subir si ha cambiado
        run: |
          if git diff --quiet -- public/datos/sap-apis.json; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/datos/sap-apis.json
          git commit -m "Lista oficial de SAP actualizada"
          git push
